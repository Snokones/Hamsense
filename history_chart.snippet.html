<!--
  Paste-in temperature-history chart for web_pages.h (index_html).
  NOT compiled/served on its own -- this is a reference snippet for the
  weekly-metrics spike. It fetches GET /history (added in sensor_logger)
  and draws a 7-day outdoor-temperature line on a <canvas>, no external libs.

  To use: drop the <div>/<canvas> where you want it in the page body, and the
  <script> anywhere after it (or before </body>). Colors use inherited/CSS
  values where possible; tweak the two constants at the top of drawHistory()
  to match the page's palette.
-->

<div class="hist-card" style="margin-top:1rem">
  <div class="hist-head" style="display:flex;justify-content:space-between;align-items:baseline">
    <span>7-day outdoor temperature</span>
    <span id="histRange" style="opacity:.6;font-size:.85em">--</span>
  </div>
  <canvas id="histCanvas" width="640" height="220" style="width:100%;height:auto;display:block"></canvas>
</div>

<script>
(function () {
  const REFRESH_MS = 15 * 60 * 1000; // re-fetch every 15 min (matches sample cadence)

  function fmtDay(ts) {
    const d = new Date(ts * 1000);
    return d.toLocaleDateString([], { weekday: 'short' });
  }
  function fmtDateTime(ts) {
    return new Date(ts * 1000).toLocaleString([], {
      month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
    });
  }

  function drawHistory(payload) {
    const LINE = '#f5a623';   // temperature line color -- match page accent
    const GRID = 'rgba(255,255,255,0.12)';

    const cv = document.getElementById('histCanvas');
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    const padL = 40, padR = 10, padT = 12, padB = 22;
    ctx.clearRect(0, 0, W, H);

    const pts = (payload.samples || []).map(s => ({ t: s[0], v: s[1] }));
    const rangeEl = document.getElementById('histRange');
    if (pts.length < 2) {
      if (rangeEl) rangeEl.textContent = 'collecting data…';
      ctx.fillStyle = GRID;
      ctx.fillText('Not enough samples yet', padL, H / 2);
      return;
    }

    const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
    let vMin = Infinity, vMax = -Infinity;
    for (const p of pts) { if (p.v < vMin) vMin = p.v; if (p.v > vMax) vMax = p.v; }
    // pad the value axis a little so the line isn't glued to the edges
    const vPad = Math.max(1, (vMax - vMin) * 0.1);
    vMin -= vPad; vMax += vPad;

    const x = t => padL + (t - t0) / (t1 - t0 || 1) * (W - padL - padR);
    const y = v => padT + (1 - (v - vMin) / (vMax - vMin || 1)) * (H - padT - padB);

    // horizontal grid + temperature labels (4 rows)
    ctx.strokeStyle = GRID; ctx.fillStyle = GRID;
    ctx.lineWidth = 1; ctx.font = '11px sans-serif'; ctx.textBaseline = 'middle';
    for (let i = 0; i <= 4; i++) {
      const v = vMin + (vMax - vMin) * i / 4;
      const yy = y(v);
      ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(W - padR, yy); ctx.stroke();
      ctx.fillText(v.toFixed(0) + '°', 6, yy);
    }
    // day boundary ticks along the x axis
    ctx.textBaseline = 'alphabetic';
    let lastDay = null;
    for (const p of pts) {
      const day = new Date(p.t * 1000).getDate();
      if (day !== lastDay) {
        lastDay = day;
        const xx = x(p.t);
        ctx.beginPath(); ctx.moveTo(xx, padT); ctx.lineTo(xx, H - padB); ctx.stroke();
        ctx.fillText(fmtDay(p.t), xx + 2, H - 8);
      }
    }

    // the temperature line
    ctx.strokeStyle = LINE; ctx.lineWidth = 2; ctx.beginPath();
    pts.forEach((p, i) => { const xx = x(p.t), yy = y(p.v); i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); });
    ctx.stroke();

    if (rangeEl) rangeEl.textContent = fmtDateTime(t0) + '  →  ' + fmtDateTime(t1);
  }

  function loadHistory() {
    fetch('/history')
      .then(r => r.json())
      .then(drawHistory)
      .catch(() => {/* device offline or endpoint absent -- leave last render */});
  }

  loadHistory();
  setInterval(loadHistory, REFRESH_MS);
})();
</script>
